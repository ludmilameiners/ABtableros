const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function probar(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.s), iterations:P.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plano = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.i)}, key, b64(P.c));
  return new TextDecoder().decode(plano);
}
async function abrir(){
  const err = document.getElementById('err'); err.textContent = '';
  const pw = document.getElementById('pw').value;
  if(!pw){ err.textContent = 'Escribí la clave.'; return; }
  try{ const html = await probar(pw); sessionStorage.setItem('abportal', pw); document.open(); document.write(html); document.close(); }
  catch(e){ err.textContent = 'Clave incorrecta. Probá de nuevo.'; }
}
(async function(){
  const pw = sessionStorage.getItem('abportal');
  if(pw){ try{ const html = await probar(pw); document.open(); document.write(html); document.close(); return; }catch(e){ sessionStorage.removeItem('abportal'); } }
  const g = document.getElementById('gatebox'); g.hidden = false;
  document.getElementById('go').addEventListener('click', abrir);
  document.getElementById('pw').addEventListener('keydown', e => { if(e.key === 'Enter') abrir(); });
  document.getElementById('pw').focus();
})();
</script>
