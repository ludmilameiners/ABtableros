<title>Tablero AB</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--paper:#EBEDF0;--card:#FFFFFF;--ink:#17202B;--ink2:#5F6A78;--line:#DEE2E6;--accent:#14243B;--neg:#B23B3B}
  @media (prefers-color-scheme: dark){:root{--paper:#161B23;--card:#1E2530;--ink:#EEF2F7;--ink2:#B6C1CF;--line:#2D3745;--accent:#4F7CC9;--neg:#E08A6F}}
  body{background:var(--paper);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:34px 30px;max-width:360px;width:100%;text-align:center}
  .gate .icon{margin-bottom:6px}.gate .icon svg{display:block;margin:0 auto}
  .gate h1{font-size:1.2rem;margin:0 0 4px;text-wrap:balance}
  .gate p{color:var(--ink2);font-size:.88rem;margin:0 0 18px}
  .gate input{width:100%;padding:10px 12px;font-size:1rem;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);margin-bottom:12px;box-sizing:border-box}
  .gate button{width:100%;padding:10px;font-size:1rem;font-weight:600;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
  .err{color:var(--neg);font-size:.85rem;min-height:1.3em;margin-top:10px}
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function probar(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.s), iterations:P.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plano = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.i)}, key, b64(P.c));
  return new TextDecoder().decode(plano);
}
async function abrir(){
  const err = document.getElementById('err'); err.textContent = '';
  const pw = document.getElementById('pw').value;
  if(!pw){ err.textContent = 'Escribí la clave.'; return; }
  try{ const html = await probar(pw); sessionStorage.setItem('abportal', pw); document.open(); document.write(html); document.close(); }
  catch(e){ err.textContent = 'Clave incorrecta. Probá de nuevo.'; }
}
(async function(){
  const pw = sessionStorage.getItem('abportal');
  if(pw){ try{ const html = await probar(pw); document.open(); document.write(html); document.close(); return; }catch(e){ sessionStorage.removeItem('abportal'); } }
  const g = document.getElementById('gatebox'); g.hidden = false;
  document.getElementById('go').addEventListener('click', abrir);
  document.getElementById('pw').addEventListener('keydown', e => { if(e.key === 'Enter') abrir(); });
  document.getElementById('pw').focus();
})();
</script>
